<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Simulateur Frais Réels 2025</title>
    <meta name="description" content="Optimisez légalement vos déductions de frais réels salariés — Déclaration de revenus 2025" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #08090f; }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }

      /* ── Styles d'impression PDF ─────────────────────────────────── */
      @media print {
        @page {
          size: A4;
          margin: 18mm 16mm 18mm 16mm;
        }
        body {
          background: #fff !important;
          color: #111 !important;
          font-family: Georgia, serif !important;
          font-size: 11pt;
        }
        /* Masquer tout sauf la zone d'impression */
        body > #root > div > header,
        .no-print {
          display: none !important;
        }
        /* Zone imprimable */
        .print-zone {
          display: block !important;
          padding: 0 !important;
          margin: 0 !important;
          max-width: 100% !important;
        }
        .print-header {
          border-bottom: 2px solid #c4a35a;
          padding-bottom: 10px;
          margin-bottom: 20px;
        }
        .print-header h1 {
          font-size: 18pt;
          color: #111;
          letter-spacing: 0.5px;
        }
        .print-header p {
          font-size: 9pt;
          color: #555;
          margin-top: 4px;
        }
        .print-score-card {
          border: 1.5px solid #c4a35a;
          border-radius: 6px;
          padding: 14px 18px;
          margin-bottom: 18px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .print-score-card .total-label { font-size: 9pt; color: #555; }
        .print-score-card .total-val { font-size: 22pt; font-weight: bold; color: #111; }
        .print-score-card .compare { font-size: 9pt; color: #555; text-align: right; }
        .print-row {
          display: flex;
          justify-content: space-between;
          padding: 7px 0;
          border-bottom: 1px solid #e8e8e8;
          font-size: 10pt;
          break-inside: avoid;
        }
        .print-row .label { color: #111; flex: 1; }
        .print-row .sub { font-size: 8pt; color: #777; margin-top: 2px; }
        .print-row .amount { font-weight: bold; white-space: nowrap; color: #111; }
        .print-row .amount.neg { color: #c0392b; }
        .print-total-row {
          display: flex;
          justify-content: space-between;
          padding: 10px 0 0;
          border-top: 2px solid #c4a35a;
          margin-top: 4px;
          font-size: 13pt;
          font-weight: bold;
        }
        .print-section-title {
          font-size: 8pt;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #888;
          margin: 14px 0 6px;
        }
        .print-justifs {
          margin-top: 18px;
          border: 1px solid #ddd;
          border-radius: 4px;
          padding: 10px 14px;
          font-size: 9pt;
          color: #444;
          line-height: 2;
          break-inside: avoid;
        }
        .print-resume {
          margin-top: 18px;
          border: 1.5px solid #c4a35a;
          border-radius: 4px;
          padding: 12px 16px;
          font-size: 9pt;
          line-height: 1.8;
          white-space: pre-wrap;
          break-inside: avoid;
        }
        .print-resume-title {
          font-size: 8pt;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #888;
          margin-bottom: 8px;
        }
        .print-footer {
          margin-top: 20px;
          border-top: 1px solid #ddd;
          padding-top: 8px;
          font-size: 7.5pt;
          color: #999;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
